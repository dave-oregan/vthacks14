name: SightlineLink
options:
  bundleIdPrefix: com.sightline
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.9.0"
targets:
  SightlineLink:
    type: application
    platform: iOS
    sources:
      - path: SightlineLink
        excludes:
          - "**/*.md"
    resources:
      - path: SightlineLink/Assets.xcassets
      - path: SightlineLink/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sightline.link
        PRODUCT_NAME: SightlineLink
        INFOPLIST_FILE: SightlineLink/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: RT83AN2JT6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    # Do NOT use xcodegen `info:` here — it overwrites Info.plist and strips privacy keys.
  SightlineLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SightlineLinkTests
      - path: SightlineLink/Networking
      - path: SightlineLink/Models
      - path: SightlineLink/Utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sightline.link.tests
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    # Hostless logic tests — do not launch the Meta DAT app under Simulator XCTest.
schemes:
  SightlineLink:
    build:
      targets:
        SightlineLink: all
        SightlineLinkTests: [test]
    test:
      targets:
        - SightlineLinkTests
      gatherCoverageData: false
